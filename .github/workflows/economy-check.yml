name: Economy checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node dist/cli.js check examples/rp-server.json --runs 500 --seed 42
      - run: node dist/cli.js check examples/indie-rpg.json --runs 500 --seed 42
